<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diseño de habitación</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--ink:#1c2330;--mut:#667085;--line:#d9dde4;--acc:#2563eb;--wall:#8a8f98}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--panel:#1b2028;--ink:#e6e9ef;--mut:#8b94a3;--line:#2b323d;--acc:#5b8def;--wall:#9aa1ad}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.35 system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:grid;grid-template-columns:250px 1fr 250px;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
header{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0 10px 0 0}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
aside{min-height:0;background:var(--panel);overflow:auto;padding:10px}
#lib{border-right:1px solid var(--line)}
#props{border-left:1px solid var(--line)}
aside h3{margin:12px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
aside h3:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.grid button{text-align:left;font-size:12px;padding:6px}
.grid small{display:block;color:var(--mut)}
.row{display:grid;grid-template-columns:80px 1fr;gap:6px;align-items:center;margin:5px 0}
.row input{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg)}
.row input[type=color]{padding:0;height:28px}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden}
svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;background:var(--bg)}
#hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--mut);background:var(--panel);padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
.ex{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:6px 0;position:relative}
.ex button{position:absolute;right:6px;top:4px;padding:0 6px}
.row select{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg)}
.cf{display:block;width:100%;text-align:left;margin:4px 0;border-color:#dc262655}
.cf small{display:block;color:var(--mut);font-size:11px}
.btns{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
@media (max-width:900px){body{grid-template-columns:1fr;grid-template-rows:auto 1fr auto auto;height:auto;overflow:auto}#stage{height:60vh}#lib,#props{border:0}}
#v3{position:absolute;inset:0;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
#v3[hidden]{display:none}
#v3bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);font-size:13px}
#v3bar select{padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg)}
#v3c{flex:1;min-height:0;position:relative}
#v3c canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<header>
  <h1>Diseño de habitación</h1>
  <button id="t-select" class="on" title="V">Seleccionar</button>
  <button id="t-wall" title="W">Dibujar tabique</button>
  <button id="undo" title="Ctrl+Z">↶</button><button id="redo" title="Ctrl+Y">↷</button>
  <button id="snap" class="on">Rejilla 5 cm</button><button id="mag" class="on">Imán a paredes</button>
  
  <button id="fit">Ajustar vista</button><button id="b3d">Vista 3D</button>
  <span style="flex:1"></span>
  <button id="save">Guardar JSON</button><button id="load">Abrir JSON</button>
  <button id="png">Exportar PNG</button><button id="reset">Plano inicial</button><button id="clear">Vaciar</button>
  <input id="file" type="file" accept=".json" hidden>
</header>
<aside id="lib"></aside>
<div id="stage"><svg id="svg"></svg><div id="hint"></div>
  <div id="v3" hidden>
    <div id="v3bar">
      <label>Cámara <select id="v3cam"><option value="orbit">Orbital (isométrica)</option><option value="top">Cenital</option><option value="door">Desde la puerta</option><option value="bed">Desde la cama (hacia la TV)</option></select></label>
      <label>Paredes <select id="v3wall"><option value="110">Corte a 110 cm</option><option value="250">Completas (250 cm)</option><option value="0">Sin paredes</option></select></label>
      <button id="v3png">Captura PNG</button>
    </div>
    <div id="v3c"></div>
  </div></div>
<aside id="props"></aside>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const KEY = "diseno_habitacion_v8";

// Catálogo (cm): w = ancho, d = fondo
const CAT = {
  "Dormitorio":[["Cama 90",90,200],["Cama 135",135,200],["Cama 150",150,200],["Cama 160",160,200],["Mesita noche",40,35],["Cómoda",100,45],["Armario 2 puertas",100,55],["Armario 3 puertas",150,55],["Armario 4 puertas",200,60],["Cuna",70,130]],
  "Estudio":[["Escritorio 140",140,60],["Escritorio en L",150,130,"L"],["Escritorio 120",120,60],["Silla",45,45],["Estantería",80,30],["Librería 2m",200,30],["Mesa de trabajo",160,80]],
  "Salón":[["Sofá 2 plazas",160,90],["Sofá 3 plazas",210,90],["Mueble TV",150,40],["Mesa centro",100,50],["Butaca",80,80],["Mesa comedor",160,90]],
  "Aperturas":[["Puerta 72",72,10,"door"],["Puerta 82",82,10,"door"],["Puerta 92",92,10,"door"],["Ventana 100",100,12,"window"],["Ventana 150",150,12,"window"]],
  "Otros":[["Texto (rótulo)",120,20,"text"],["Radiador",80,10],["Alfombra 160x230",160,230],["Pilar",30,30],["Bloque libre",100,100]]
};
const COLORS = {Dormitorio:"#7aa7e0",Estudio:"#e0b36a",Salón:"#8fc79a",Otros:"#b7a2d6",Aperturas:"#fff"};

let S = {room:{w:400,h:300}, walls:[], items:[]};
let tool="select", snapOn=true, magOn=true, sel=null, hist=[], fut=[], uid=1, drag=null, vb={x:-60,y:-60,w:520,h:420};

/* ---------- estado / historial ---------- */
const snapshot = () => JSON.stringify(S);
function commit(){ hist.push(snapshot()); if(hist.length>200)hist.shift(); fut=[]; persist(); }
function persist(){ try{localStorage.setItem(KEY,snapshot())}catch(e){} }
function sanitize(o){
  if(!o||typeof o!=="object"||!o.room||!Array.isArray(o.items)||!Array.isArray(o.walls)) throw new Error("formato");
  const n=(v,d)=>Number.isFinite(+v)?+v:d;
  o.room.w=Math.max(100,n(o.room.w,400)); o.room.h=Math.max(100,n(o.room.h,300));
  o.walls=o.walls.filter(w=>w&&[w.x1,w.y1,w.x2,w.y2].every(Number.isFinite)).map(w=>({...w,t:Math.max(2,n(w.t,10))}));
  let id=1+Math.max(0,...o.items.map(i=>+i.id||0),...o.walls.map(w=>+w.id||0));
  const seen=new Set(); o.items=o.items.filter(i=>i&&typeof i.name==="string").map(i=>{ i.w=Math.max(1,n(i.w,50)); i.d=Math.max(1,n(i.d,50)); i.x=n(i.x,0); i.y=n(i.y,0); i.rot=((n(i.rot,0)%360)+360)%360; if(!Number.isFinite(+i.id)||seen.has(+i.id)) i.id=id++; seen.add(+i.id); return i; });
  return o;
}
function restore(j){ S=sanitize(JSON.parse(j)); sel=null; uid=1+Math.max(0,...S.items.map(i=>i.id),...S.walls.map(w=>w.id)); render(); }
function undo(){ if(hist.length>1){ fut.push(hist.pop()); restore(hist[hist.length-1]); persist(); } }
function redo(){ if(fut.length){ const j=fut.pop(); hist.push(j); restore(j); persist(); } }

/* ---------- utilidades ---------- */
const sn = v => snapOn ? Math.round(v/5)*5 : Math.round(v);
const svg = $("#svg");
function pt(e){ const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; const q=p.matrixTransform(svg.getScreenCTM().inverse()); return {x:q.x,y:q.y}; }
const el = (n,a={},p) => { const e=document.createElementNS(NS,n); for(const k in a)e.setAttribute(k,a[k]); if(p)p.appendChild(e); return e; };
const wLen = w => Math.hypot(w.x2-w.x1,w.y2-w.y1);
/* Paredes exteriores: ids -1..-4 (n,s,w,e). Cara interior en x0/y0 y x0+w/y0+h; el grosor crece hacia fuera. */
const OW={"-1":"n","-2":"s","-3":"w","-4":"e"}, OWID={n:-1,s:-2,w:-3,e:-4};
function room(){ const R=S.room; R.x0=R.x0||0; R.y0=R.y0||0; R.t=Object.assign({n:12,s:12,w:12,e:12},R.t); R.dir=Object.assign({n:"out",s:"out",w:"out",e:"out"},R.dir); R.ext=R.ext||{}; return R; }
function outerObj(id){ const R=room(), ow=OW[id]; return {id,outer:true,ow,t:R.t[ow],pos:ow==="n"?R.y0:ow==="s"?R.y0+R.h:ow==="w"?R.x0:R.x0+R.w}; }
const find = id => id<0 ? outerObj(id) : (S.items.find(i=>i.id===id) || S.walls.find(w=>w.id===id));
/* Una pared exterior = tramos consecutivos; cada tramo tiene su grosor (el base R.t[lado] salvo tramos R.ext[lado]=[{a,b,t}] con otro grosor).
   a/b en cm a lo largo de la pared (n/s: coordenada X; w/e: coordenada Y). */
function wallPieces(ow){
  const R=room(), hz=ow==="n"||ow==="s", A=hz?R.x0-R.t.w:R.y0, B=hz?R.x0+R.w+R.t.e:R.y0+R.h, ex=(R.ext[ow]||[]).filter(e=>e.b>e.a);
  const cuts=[...new Set([A,B,...ex.flatMap(e=>[e.a,e.b]).filter(v=>v>A&&v<B)])].sort((p,q)=>p-q), out=[];
  const pos=ow==="n"?R.y0:ow==="s"?R.y0+R.h:ow==="w"?R.x0:R.x0+R.w, osign=(ow==="n"||ow==="w")?-1:1;
  for(let i=0;i<cuts.length-1;i++){ const a=cuts[i],b=cuts[i+1],m=(a+b)/2, e=ex.filter(e=>m>e.a&&m<e.b).pop(), t=e?e.t:R.t[ow], dir=e?(e.dir||"out"):R.dir[ow];
    const fix=pos+(dir==="in"?-osign:osign)*t/2;
    out.push({ow,a,b,t,dir,fix,lo:fix-t/2,face:pos+(dir==="in"?-osign*t:0),ov:!!e}); }   // face = cara interior del tramo
  return out;
}
/* aperturas (puertas/ventanas) que están sobre una pared exterior; filtro opcional por tramo */
function openingsOn(ow,pf){ const hz=ow==="n"||ow==="s";
  return wallPieces(ow).filter(p=>!pf||pf(p)).flatMap(p=>S.items.filter(i=>(i.kind==="door"||i.kind==="window")&&(i.rot%180===0)===hz&&(hz?i.x:i.y)>=p.a-1&&(hz?i.x:i.y)<=p.b+1&&Math.abs((hz?i.y:i.x)-p.fix)<=p.t/2+10)); }
function shiftOpenings(list,horiz,d){ for(const i of new Set(list)){ if(horiz)i.y+=d; else i.x+=d; } }
function moveOuter(ow,newPos){
  const R=room(), o=outerObj(OWID[ow]), d=newPos-o.pos, horiz=ow==="n"||ow==="s", list=openingsOn(ow);
  if(!d) return;
  if(ow==="n"){ if(R.h-d<100)return; R.y0+=d; R.h-=d; }
  else if(ow==="s"){ if(R.h+d<100)return; R.h+=d; }
  else if(ow==="w"){ if(R.w-d<100)return; R.x0+=d; R.w-=d; }
  else { if(R.w+d<100)return; R.w+=d; }
  shiftOpenings(list,horiz,d);
}
/* aplica un cambio a la pared y recoloca sus aperturas para que sigan centradas en su tramo */
function reanchor(ow,mutate){
  const hz=ow==="n"||ow==="s", at=i=>{ const al=hz?i.x:i.y; return wallPieces(ow).find(p=>al>=p.a-1&&al<=p.b+1); };
  const list=[...new Set(openingsOn(ow))].map(i=>({i,f:at(i).fix}));
  mutate();
  for(const {i,f} of list){ const p=at(i); if(p){ const d=p.fix-f; if(hz)i.y+=d; else i.x+=d; } }
}
function setOuterT(ow,t){ const R=room(); reanchor(ow,()=>{ R.t[ow]=Math.max(2,t); }); }
function setOuterDir(ow,dir){ const R=room(); reanchor(ow,()=>{ R.dir[ow]=dir; }); }
function setExt(ow,i,patch){ const e=room().ext[ow][i]; reanchor(ow,()=>Object.assign(e,patch)); }
const isWall = o => o && "x1" in o;
const isFurn = o => o && !o.outer && !isWall(o);

/* ---------- Revisión: solapes entre muebles, paredes y barridos de puerta ---------- */
const OPEN_H=205;
function toPlan(it,x,y){ x*=it.fx?-1:1; y*=it.fy?-1:1; const a=it.rot*Math.PI/180,c=Math.cos(a),s=Math.sin(a); return [it.x+x*c-y*s, it.y+x*s+y*c]; }
const rectPoly=(x0,y0,x1,y1)=>[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
function footprint(it){            // lista de polígonos convexos en coordenadas del plano
  const w=it.w,d=it.d, T=(poly)=>poly.map(([x,y])=>toPlan(it,x,y));
  if(it.shape==="L"){ const a=Math.min(it.a,d), b=Math.min(it.b,w);
    return [T(rectPoly(-w/2,-d/2,w/2,-d/2+a)), T(rectPoly(-w/2,-d/2+a,-w/2+b,d/2))]; }
  return [T(rectPoly(-w/2,-d/2,w/2,d/2))];
}
function swingPoly(it){            // cuarto de círculo del barrido de la puerta (convexo)
  const w=it.w, pts=[[-w/2,0]]; for(let k=0;k<=8;k++){ const th=-Math.PI/2+k*(Math.PI/2)/8; pts.push([-w/2+w*Math.cos(th), w*Math.sin(th)]); }
  return pts.map(([x,y])=>toPlan(it,x,y));
}
function wallPolys(){
  const out=[];
  for(const w of S.walls){ const L=wLen(w)||1, ux=(w.x2-w.x1)/L, uy=(w.y2-w.y1)/L, nx=-uy*w.t/2, ny=ux*w.t/2;
    out.push({name:"tabique",poly:[[w.x1+nx,w.y1+ny],[w.x2+nx,w.y2+ny],[w.x2-nx,w.y2-ny],[w.x1-nx,w.y1-ny]]}); }
  for(const k of ["n","s","w","e"]) for(const p of wallPieces(k))
    out.push({name:"pared exterior",poly:(k==="n"||k==="s")?rectPoly(p.a,p.lo,p.b,p.lo+p.t):rectPoly(p.lo,p.a,p.lo+p.t,p.b)});
  return out;
}
function satDepth(P,Q){            // profundidad mínima de solape (≤0 = no se tocan)
  let best=Infinity;
  for(const poly of [P,Q]) for(let i=0;i<poly.length;i++){ const [x1,y1]=poly[i],[x2,y2]=poly[(i+1)%poly.length]; let nx=y1-y2, ny=x2-x1; const L=Math.hypot(nx,ny)||1; nx/=L; ny/=L;
    let a0=Infinity,a1=-Infinity,b0=Infinity,b1=-Infinity;
    for(const [x,y] of P){ const v=x*nx+y*ny; a0=Math.min(a0,v); a1=Math.max(a1,v); }
    for(const [x,y] of Q){ const v=x*nx+y*ny; b0=Math.min(b0,v); b1=Math.max(b1,v); }
    const o=Math.min(a1,b1)-Math.max(a0,b0); if(o<=0) return 0; best=Math.min(best,o); }
  return best;
}
function conflicts(){
  const EPS=1, res=new Map(), add=(id,msg)=>{ (res.get(id)||res.set(id,[]).get(id)).push(msg); };
  const solid=S.items.filter(i=>!i.kind), doors=S.items.filter(i=>i.kind==="door"), W=wallPolys();
  const span=i=>[i.z||0,(i.z||0)+(i.h||defH(i.name))], fp=new Map(solid.map(i=>[i.id,footprint(i)]));
  const hit=(A,B)=>A.some(p=>B.some(q=>satDepth(p,q)>EPS));
  for(const i of solid){
    for(const w of W) if(hit(fp.get(i.id),[w.poly])) add(i.id,`toca/atraviesa ${w.name}`);
    for(const d of doors){ if(span(i)[0]<OPEN_H && hit(fp.get(i.id),[swingPoly(d)])) add(i.id,`bloquea el barrido de «${d.name}»`); }
  }
  for(let a=0;a<solid.length;a++) for(let b=a+1;b<solid.length;b++){ const A=solid[a],B=solid[b], sa=span(A), sb=span(B);
    if(Math.min(sa[1],sb[1])-Math.max(sa[0],sb[0])<=2) continue;      // a distinta altura (p. ej. TV sobre escritorio) no chocan
    if(hit(fp.get(A.id),fp.get(B.id))){ add(A.id,`solapa con «${B.name}»`); add(B.id,`solapa con «${A.name}»`); } }
  return res;
}
let CONF=new Map();
/* ---------- render ---------- */
let rafPending=false;
function scheduleRender(){ if(rafPending) return; rafPending=true; requestAnimationFrame(()=>{ rafPending=false; render(); }); }
function render(){
  if(typeof V3!=="undefined"&&V3.on) V3.dirty=true;
  const R=room(), RW=R.w, RH=R.h, X0=R.x0, Y0=R.y0, T=R.t;
  CONF=conflicts();
  svg.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  svg.textContent="";
  // rejilla 50 cm
  const g0=el("g",{},svg);
  for(let x=Math.floor(vb.x/50)*50;x<vb.x+vb.w;x+=50) el("line",{x1:x,y1:vb.y,x2:x,y2:vb.y+vb.h,stroke:"currentColor","stroke-opacity":x%100?".05":".12"},g0);
  for(let y=Math.floor(vb.y/50)*50;y<vb.y+vb.h;y+=50) el("line",{x1:vb.x,y1:y,x2:vb.x+vb.w,y2:y,stroke:"currentColor","stroke-opacity":y%100?".05":".12"},g0);
  // habitación: cuatro paredes exteriores independientes + suelo
  el("rect",{x:X0,y:Y0,width:RW,height:RH,fill:"var(--panel)"},svg);
  for(const k of ["n","s","w","e"]){ const on=sel===OWID[k];
    for(const p of wallPieces(k)){
      const r=(k==="n"||k==="s")?[p.a,p.lo,p.b-p.a,p.t]:[p.lo,p.a,p.t,p.b-p.a];
      el("rect",{x:r[0],y:r[1],width:r[2],height:r[3],fill:"var(--wall)","data-id":OWID[k],stroke:on?"var(--acc)":"none","stroke-width":on?2.5:0,style:"cursor:move"},svg);
      if(on){ const t=el("text",{x:r[0]+r[2]/2,y:r[1]+r[3]/2,"text-anchor":"middle","dominant-baseline":"middle","font-size":11,fill:"#fff","pointer-events":"none"},svg); t.textContent=p.t+" cm"+(p.dir==="in"?" ↑":""); } } }
  dimLabel(svg,X0,Y0-T.n-6,RW,0,`${RW} cm`);
  dimLabel(svg,X0-T.w-6,Y0,RH,-90,`${RH} cm`);
  // tabiques
  for(const w of S.walls) drawWall(w);
  // mobiliario (aperturas al final para quedar sobre muros)
  [...S.items].sort((a,b)=>(a.kind?1:0)-(b.kind?1:0)).forEach(drawItem);
  if(drag&&drag.ghost){ const w=drag.ghost; drawWall(w,true); }
  props(); hint();
  for(const [id,v] of [["#rw",RW],["#rh",RH]]){ const e=$(id); if(e&&document.activeElement!==e) e.value=v; }
}
function dimLabel(p,x,y,len,rot,text){
  const t=el("text",{x:x+(rot?0:len/2),y:y+(rot?len/2:0),"text-anchor":"middle","font-size":11,fill:"currentColor","fill-opacity":".7",transform:`rotate(${rot} ${x+(rot?0:len/2)} ${y+(rot?len/2:0)})`},p); t.textContent=text;
}
function drawWall(w,ghost){
  const g=el("g",{"data-id":w.id,opacity:ghost?.6:1},svg);
  const a=Math.atan2(w.y2-w.y1,w.x2-w.x1)*180/Math.PI, L=wLen(w);
  const r=el("rect",{x:0,y:-w.t/2,width:L,height:w.t,transform:`translate(${w.x1} ${w.y1}) rotate(${a})`,fill:"#b9a98f",stroke:sel===w.id?"var(--acc)":"#6f6451","stroke-width":sel===w.id?2:1},g);
  // montantes cada 40 cm
  for(let d=0;d<=L;d+=40) el("line",{x1:d,y1:-w.t/2,x2:d,y2:w.t/2,stroke:"#6f6451","stroke-width":.7,transform:`translate(${w.x1} ${w.y1}) rotate(${a})`},g);
  const mx=(w.x1+w.x2)/2,my=(w.y1+w.y2)/2, ang=(a>90||a<-90)?a+180:a;
  const t=el("text",{x:mx,y:my-w.t/2-4,"text-anchor":"middle","font-size":11,fill:"currentColor",transform:`rotate(${ang} ${mx} ${my})`},g);
  t.textContent=Math.round(L)+" cm";
  if(sel===w.id&&!ghost){ for(const [k,x,y] of [[1,w.x1,w.y1],[2,w.x2,w.y2]]) el("circle",{cx:x,cy:y,r:6,fill:"var(--acc)","data-h":k,"data-id":w.id,style:"cursor:move"},svg); }
}
function hostThickness(it){

  for(const ow of horiz?["n","s"]:["w","e"]) for(const p of wallPieces(ow)){ if((horiz?it.x:it.y)>=p.a-1&&(horiz?it.x:it.y)<=p.b+1&&Math.abs((horiz?it.y:it.x)-p.fix)<=p.t/2+10) return p.t; }

/* símbolos 2D por tipo (el frente es siempre el lado +y local; «Espejo V» lo invierte) */
function sym(g,it,stroke,sw){

  const line=(x1,y1,x2,y2,col="#00000055",wd=1)=>el("line",{x1,y1,x2,y2,stroke:col,"stroke-width":wd,"stroke-linecap":"round"},g);
  if(/^Cama|^Cuna/.test(n)){
    R(x0,y0,w,d,{...body,rx:3});
    R(x0,y0,w,Math.min(9,d*.05),{fill:"#00000040"});                                   // cabecero
    const pw=w/2-8; for(const sx of [-1,1]) R(sx*(w/4)-pw/2,y0+Math.min(13,d*.07),pw,Math.min(30,d*.16),{fill:"#fff","fill-opacity":.85,stroke:"#00000030",rx:6});
    R(x0+3,y0+Math.min(52,d*.27),w-6,d-Math.min(52,d*.27)-3,{fill:"#ffffff22",stroke:"#00000030",rx:3});   // nórdico
    line(x0+3,y0+Math.min(80,d*.4),x0+w-3,y0+Math.min(80,d*.4),"#00000030");
  } else if(/^Armario|^Estantería|^Librería|^Cómoda/.test(n)){
    R(x0,y0,w,d,{...body,rx:2});
    const k=Math.max(2,Math.round(w/50)); for(let i=1;i<k;i++){ const x=x0+i*w/k; line(x,y0+1,x,y0+d-1); el("circle",{cx:x-4,cy:y0+d-5,r:1.3,fill:"#333"},g); el("circle",{cx:x+4,cy:y0+d-5,r:1.3,fill:"#333"},g); }
    line(x0+2,y0+d-1.5,x0+w-2,y0+d-1.5,"#000000aa",2);                                  // frente
  } else if(it.shape==="L"){
    const a=Math.min(it.a,d),b=Math.min(it.b,w);
    el("path",{d:`M ${x0} ${y0} h ${w} v ${a} H ${x0+b} V ${-y0} H ${x0} Z`,...body},g);
    el("path",{d:`M ${x0+3} ${y0+3} h ${w-6} v ${a-6} H ${x0+b-3} V ${-y0-3} H ${x0+3} Z`,fill:"none",stroke:"#00000026"},g);
    line(x0+w-1.5,y0+2,x0+w-1.5,y0+a-2,"#000000aa",2); line(x0+b-1.5,y0+a+2,x0+b-1.5,-y0-2,"#000000aa",2);   // bordes de uso (frente)
  } else if(/^Escritorio|^Mesa/.test(n)&&!/noche/.test(n)){
    R(x0,y0,w,d,{...body,rx:2}); R(x0+3,y0+3,w-6,d-6,{fill:"none",stroke:"#00000026"}); line(x0+2,y0+d-1.5,x0+w-2,y0+d-1.5,"#000000aa",2);
  } else if(/^Silla/.test(n)){
    R(x0+2,y0+6,w-4,d-8,{...body,rx:Math.min(w,d)*.25}); R(x0+1,y0,w-2,7,{fill:"#00000055",rx:3});          // respaldo en -y
  } else if(/^Sofá|^Butaca/.test(n)){
    R(x0,y0,w,d,{...body,rx:5}); R(x0,y0,w,Math.min(18,d*.2),{fill:"#00000030",rx:4}); R(x0,y0+8,Math.min(14,w*.1),d-8,{fill:"#00000026"}); R(x0+w-Math.min(14,w*.1),y0+8,Math.min(14,w*.1),d-8,{fill:"#00000026"});
  } else if(/^TV/.test(n)){
    R(x0,y0,w,d,{fill:"#374151",stroke,"stroke-width":sw,rx:1.5}); line(x0+3,y0+d-1,x0+w-3,y0+d-1,"#9ca3af",1.2);  // pantalla en +y
  } else if(/Mesita/.test(n)){
    R(x0,y0,w,d,{...body,rx:2}); line(x0+3,y0+d*.62,x0+w-3,y0+d*.62); el("circle",{cx:0,cy:y0+d*.82,r:1.5,fill:"#333"},g);
  } else if(/^Radiador/.test(n)){
    R(x0,y0,w,d,{...body}); for(let x=x0+6;x<x0+w-3;x+=6) line(x,y0+1,x,y0+d-1,"#00000040");
  } else if(/^Alfombra/.test(n)){
    R(x0,y0,w,d,{...body,"fill-opacity":.45,rx:6,"stroke-dasharray":"5 3"}); R(x0+8,y0+8,w-16,d-16,{fill:"none",stroke:"#00000030",rx:4});
  } else if(/^Pilar/.test(n)){
    R(x0,y0,w,d,{fill:"#6b7280",stroke,"stroke-width":sw}); line(x0,y0,x0+w,y0+d,"#ffffff66"); line(x0+w,y0,x0,y0+d,"#ffffff66");
  } else R(x0,y0,w,d,{...body,rx:2});
}
function drawItem(it){
  const g=el("g",{"data-id":it.id,transform:`translate(${it.x} ${it.y}) rotate(${it.rot}) scale(${it.fx?-1:1} ${it.fy?-1:1})`,style:"cursor:move"},svg);
  const s=sel===it.id, bad=CONF.has(it.id), stroke=s?"var(--acc)":bad?"#dc2626":"#00000066";
  if(it.kind==="door"){
    const w=it.w;
    const ht=hostThickness(it); el("rect",{x:-w/2,y:-ht/2-1,width:w,height:ht+2,fill:"var(--panel)"},g);
    el("path",{d:`M ${-w/2} 0 L ${-w/2} ${-w} A ${w} ${w} 0 0 1 ${w/2} 0 Z`,fill:"#2563eb14",stroke:stroke,"stroke-dasharray":"4 3"},g);
    el("line",{x1:-w/2,y1:0,x2:-w/2,y2:-w,stroke:s?"var(--acc)":"#555","stroke-width":3},g);
  } else if(it.kind==="text"){
    el("rect",{x:-it.w/2,y:-it.d/2,width:it.w,height:it.d,fill:"transparent",stroke:s?"var(--acc)":"none","stroke-dasharray":"3 3"},g);
  } else if(it.kind==="window"){
    const wt=hostThickness(it); el("rect",{x:-it.w/2,y:-wt/2,width:it.w,height:wt,fill:"#bfe3f5",stroke:stroke,"stroke-width":s?2:1},g);
    el("line",{x1:-it.w/2,y1:0,x2:it.w/2,y2:0,stroke:"#4a90b8"},g);
  } else {
    sym(g,it,stroke,s?2.5:bad?2:1);
  }
  // etiqueta: sigue el eje largo del mueble y se ajusta de tamaño para caber
  const label=it.kind==="text"?it.name:it.kind?(s?it.name:""):it.shape==="L"?"Escritorio en L":`${it.name} ${it.w}×${it.d}`;
  const vert=it.rot%180===90, along=vert?it.d>=0&&it.w:it.w;
  const t=el("text",{x:0,y:it.kind==="door"?-it.w/2:it.shape==="L"?(-it.d/2+Math.min(it.a,it.d)/2):0,"text-anchor":"middle","dominant-baseline":"middle","pointer-events":"none",fill:"#111"},g);
  t.setAttribute("transform",`scale(${it.fx?-1:1} ${it.fy?-1:1})`+(vert?"":` rotate(${-it.rot})`));
  t.textContent=label;
  let fs=Math.max(5,Math.min(10,(along*1.6)/Math.max(1,label.length)));
  if(it.kind==="text"){ fs=it.d*.6; t.setAttribute("font-weight",600); t.setAttribute("fill","currentColor"); t.setAttribute("fill-opacity",".55"); }
  t.setAttribute("font-size",fs);
}

/* imán: pega los bordes del mueble a caras de paredes/tabiques a <8 cm (solo giros múltiplos de 90°) */
function magnet(o,x,y){
  if(o.rot%90) return [x,y];
  const sw=o.rot%180===0, hx=(sw?o.w:o.d)/2, hy=(sw?o.d:o.w)/2, T=8;
  const R=room(), V=[], H=[];
  for(const k of ["n","s","w","e"]) for(const p of wallPieces(k)) (k==="n"||k==="s"?H:V).push([p.face,p.a,p.b]);
  for(const w of S.walls){ const t=w.t/2;
    if(w.x1===w.x2){ const a=Math.min(w.y1,w.y2),b=Math.max(w.y1,w.y2); V.push([w.x1-t,a,b],[w.x1+t,a,b]); }
    else if(w.y1===w.y2){ const a=Math.min(w.x1,w.x2),b=Math.max(w.x1,w.x2); H.push([w.y1-t,a,b],[w.y1+t,a,b]); } }
  let bx=T,by=T,nx=x,ny=y;
  for(const [f,a,b] of V){ if(y+hy<a-T||y-hy>b+T)continue; for(const c of [f+hx,f-hx]){ const d=Math.abs(x-c); if(d<bx){bx=d;nx=c;} } }
  for(const [f,a,b] of H){ if(x+hx<a-T||x-hx>b+T)continue; for(const c of [f+hy,f-hy]){ const d=Math.abs(y-c); if(d<by){by=d;ny=c;} } }
  return [nx,ny];
}

let WOOD=null;
function woodTexture(){          // tablones procedurales (sin ficheros externos)
  if(WOOD) return WOOD; const c=document.createElement("canvas"); c.width=c.height=512; const x=c.getContext("2d");
  const rnd=(i)=>{ const v=Math.sin(i*127.1)*43758.5453; return v-Math.floor(v); };
  for(let r=0;r<8;r++){ const y=r*64; for(let q=0;q<3;q++){ const off=(r%2)*100+q*170, w=170; const l=62+rnd(r*7+q)*10; x.fillStyle=`hsl(32 ${34+rnd(r+q)*8}% ${l}%)`; x.fillRect(off%512,y,w,64); x.fillRect((off%512)-512,y,w,64); } }

}
function buildScene(items){

      g.add(box3(2.5,lh,ht+1,fr,-w/2-1.2,lh/2,0)); g.add(box3(2.5,lh,ht+1,fr,w/2+1.2,lh/2,0)); if(WH>=206) g.add(box3(w+5,3,ht+1,fr,0,204.5,0));
      g.add(box3(3,10,2,0x444444,-w/2+3,100,-w+8,{metalness:.6})); }

}
function furniture(g,it){

    g.add(box3(w-2,h-26,5,col,-0,(h+26)/2-1,d/2-1));                                             // caída a los pies

    g.add(box3(w+6,h+58,7,0x6b4f3a,0,(h+58)/2,-d/2-2)); g.add(box3(w-6,h+30,3,0x9a7b5c,0,(h+30)/2+18,-d/2+2));   // cabecero
  } else if(/^Armario|^Estantería|^Librería|^Cómoda/.test(n)){

    g.add(box3(w+1,2,d+1,col,0,h-1,0));
    if(shelf){ for(let y=30;y<h-10;y+=35) g.add(box3(w-4,1.5,2,0x222222,0,y,d/2+.2)); }
    else { const k=Math.max(2,Math.round(w/50)); for(let i=1;i<k;i++){ const x=-w/2+i*w/k; g.add(box3(.8,h-12,1,0x4a3d2b,x,h/2+3,d/2+.3)); g.add(box3(1.5,22,2,0x333333,x-4,h*.5,d/2+1,{metalness:.5})); g.add(box3(1.5,22,2,0x333333,x+4,h*.5,d/2+1,{metalness:.5})); } }

    g.add(box3(w-10,Math.min(14,h*.2),1.5,0x3d3d3d,0,h-3-Math.min(14,h*.2)/2,-d/2+4));
  } else if(/^TV/.test(n)){
    g.add(box3(w,h,d,0x0b0b0b,0,z0+h/2,0)); g.add(box3(w-4,h-4,1,0x1c2a38,0,z0+h/2,d/2+.1,{emissive:0x0a1520}));
    g.add(box3(w*.3,h*.5,3,0x222222,0,z0+h/2,-d/2-2));                                           // soporte de pared
    return;
  } else if(/^Silla/.test(n)){
    const sh=Math.min(h*.5,46), sc=0x3b3b3b;
    g.add(box3(w-2,5,d-2,col,0,sh,2)); for(const sx of[-1,1])for(const sz of[-1,1]) leg(sx*(w/2-5),sz*(d/2-5)+2,sh-2.5,3,sc);
    g.add(box3(w-4,Math.max(20,h-sh-6),4,col,0,sh+Math.max(20,h-sh-6)/2+2.5,-d/2+2));            // respaldo (-z)
  } else if(/^Sofá|^Butaca/.test(n)){
    const sh=42; g.add(box3(w,sh-8,d,col,0,8+(sh-8)/2,0));
    g.add(box3(w-24,12,d-24,col,0,sh+4,10)); g.add(box3(w,h-sh+14,18,col,0,(h+sh)/2-3,-d/2+9));
    for(const sx of[-1,1]) g.add(box3(12,h-sh+14-14,d,col,sx*(w/2-6),sh+(h-sh)/2-6,0));
  } else if(/Mesita/.test(n)){
    g.add(box3(w,h-8,d,col,0,8+(h-8)/2,0)); for(const sx of[-1,1])for(const sz of[-1,1]) leg(sx*(w/2-3),sz*(d/2-3),8,3,dark);
    g.add(box3(w-6,1.5,1,0x333333,0,h*.62,d/2+.3)); g.add(box3(w-6,1.5,1,0x333333,0,h*.32,d/2+.3)); g.add(box3(5,2,2,0x999999,0,h*.77,d/2+.8,{metalness:.7})); g.add(box3(5,2,2,0x999999,0,h*.47,d/2+.8,{metalness:.7}));
  } else if(/^Radiador/.test(n)){
    const k=Math.max(3,Math.floor(w/7)); for(let i=0;i<k;i++) g.add(box3(4,Math.max(40,h),Math.max(4,d),0xf5f5f5,-w/2+3.5+i*(w-7)/(k-1),z0+Math.max(40,h)/2+10,0));
  } else if(/^Alfombra/.test(n)){
    g.add(box3(w,1.5,d,col,0,.75,0)); g.add(box3(w-14,1.8,d-14,0xffffff,0,.9,0,{transparent:true,opacity:.18}));
  } else if(/^Pilar/.test(n)){
    g.add(box3(w,Math.max(h,250),d,0xbcbcbc,0,Math.max(h,250)/2,0));
  } else g.add(box3(w,h,d,col,0,z0+h/2,0));
}
let R3=null,CT=null,CAM3=null,SC3=[],RO=null;
function init3D(){
  const host=$("#v3c"); R3=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); R3.setPixelRatio(Math.min(2,devicePixelRatio||1));
  R3.shadowMap.enabled=true; R3.shadowMap.type=THREE.PCFSoftShadowMap; R3.setScissorTest(true); host.appendChild(R3.domElement);
  CAM3=new THREE.PerspectiveCamera(45,1,5,4000); CT=new THREE.OrbitControls(CAM3,R3.domElement); CT.maxPolarAngle=Math.PI*.499; CT.addEventListener("change",()=>{ V3.redraw=true; });
  RO=new ResizeObserver(()=>{ V3.redraw=true; R3.setSize(host.clientWidth,host.clientHeight,false); R3.domElement.style.width="100%"; R3.domElement.style.height="100%"; }); RO.observe(host);
  setCam(V3.cam);
}
function setCam(k){
  V3.cam=k; const R0=room(), W=R0.w,H=R0.h, bed=S.items.find(i=>/^Cama/.test(i.name)), tv=S.items.find(i=>/^TV/.test(i.name));
  const X0=R0.x0,Y0=R0.y0; let p=[X0+W/2+100,600,Y0+H+470], t=[X0+W/2,0,Y0+H/2];
  if(k==="top"){ p=[X0+W/2,Math.max(W,H)*1.25,Y0+H/2+1]; }
  if(k==="door"){ const dw=S.items.find(i=>i.kind==="door"&&i.x<=X0+5&&i.rot%180===90); const yy=dw?dw.y:Y0+H*.5; p=[X0+14,160,yy]; t=[X0+W*.6,100,yy]; }
  if(k==="bed"){ if(bed){ p=[bed.x,95,bed.y]; } t=tv?[tv.x,(tv.z||75)+(tv.h||71)/2,tv.y]:[X0+W/2,90,Y0+H/2]; }
  CAM3.position.set(...p); CT.target.set(...t); CT.update();
}
function loop3D(tok){          // bucle ligero: solo dibuja si cambió la escena, la cámara o el tamaño
  if(!V3.on||tok!==V3.tok) return; requestAnimationFrame(()=>loop3D(tok));
  if(V3.dirty){ V3.dirty=false; V3.redraw=true; SC3=[buildScene(S.items)]; }
  CT.update(); if(!V3.redraw) return; V3.redraw=false;
  const w=R3.domElement.clientWidth,h=R3.domElement.clientHeight;
  R3.setViewport(0,0,w,h); R3.setScissor(0,0,w,h); CAM3.aspect=w/h; CAM3.updateProjectionMatrix(); R3.render(SC3[0],CAM3);
}
function toggle3D(){
  if(typeof THREE==="undefined"){ alert("No se pudo cargar vendor/three.min.js"); return; }
  V3.on=!V3.on; $("#v3").hidden=!V3.on; $("#b3d").classList.toggle("on",V3.on);
  if(V3.on){ if(!R3) init3D(); V3.dirty=true; setCam(V3.cam); const tok=V3.tok=(V3.tok||0)+1; requestAnimationFrame(()=>loop3D(tok)); }
}
$("#b3d").onclick=toggle3D;
$("#v3cam").onchange=e=>setCam(e.target.value);
$("#v3wall").onchange=e=>{ V3.wallH=+e.target.value; V3.dirty=true; };
$("#v3png").onclick=()=>{ V3.dirty=true; V3.redraw=true; requestAnimationFrame(()=>R3.domElement.toBlob(b=>download(b,"habitacion-3d.png"))); };
