<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diseño de habitación</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--ink:#1c2330;--mut:#667085;--line:#d9dde4;--acc:#2563eb;--wall:#8a8f98}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--panel:#1b2028;--ink:#e6e9ef;--mut:#8b94a3;--line:#2b323d;--acc:#5b8def;--wall:#9aa1ad}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.35 system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:grid;grid-template-columns:250px 1fr 250px;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
header{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0 10px 0 0}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
aside{min-height:0;background:var(--panel);overflow:auto;padding:10px}
#lib{border-right:1px solid var(--line)}
#props{border-left:1px solid var(--line)}
aside h3{margin:12px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
aside h3:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.grid button{text-align:left;font-size:12px;padding:6px}
.grid small{display:block;color:var(--mut)}
.row{display:grid;grid-template-columns:80px 1fr;gap:6px;align-items:center;margin:5px 0}
.row input{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg)}
.row input[type=color]{padding:0;height:28px}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden}
svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;background:var(--bg)}
#hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--mut);background:var(--panel);padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
.btns{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
@media (max-width:900px){body{grid-template-columns:1fr;grid-template-rows:auto 1fr auto auto;height:auto;overflow:auto}#stage{height:60vh}#lib,#props{border:0}}
#v3{position:absolute;inset:0;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
#v3[hidden]{display:none}
#v3bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);font-size:13px}
#v3bar select{padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg)}
#v3c{flex:1;min-height:0;position:relative}
#v3c canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<header>
  <h1>Diseño de habitación</h1>
  <button id="t-select" class="on" title="V">Seleccionar</button>
  <button id="t-wall" title="W">Dibujar tabique</button>
  <button id="undo" title="Ctrl+Z">↶</button><button id="redo" title="Ctrl+Y">↷</button>
  <button id="snap" class="on">Rejilla 5 cm</button><button id="mag" class="on">Imán a paredes</button>
  
  <button id="fit">Ajustar vista</button><button id="b3d">Vista 3D</button>
  <span style="flex:1"></span>
  <button id="save">Guardar JSON</button><button id="load">Abrir JSON</button>
  <button id="png">Exportar PNG</button><button id="reset">Plano inicial</button><button id="clear">Vaciar</button>
  <input id="file" type="file" accept=".json" hidden>
</header>
<aside id="lib"></aside>
<div id="stage"><svg id="svg"></svg><div id="hint"></div>
  <div id="v3" hidden>
    <div id="v3bar">
      <label>Cámara <select id="v3cam"><option value="orbit">Orbital (isométrica)</option><option value="top">Cenital</option><option value="door">Desde la puerta</option><option value="bed">Desde la cama (hacia la TV)</option></select></label>
      <label>Paredes <select id="v3wall"><option value="110">Corte a 110 cm</option><option value="250">Completas (250 cm)</option><option value="0">Sin paredes</option></select></label>
      <button id="v3png">Captura PNG</button>
    </div>
    <div id="v3c"></div>
  </div></div>
<aside id="props"></aside>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const KEY = "diseno_habitacion_v5";

// Catálogo (cm): w = ancho, d = fondo
const CAT = {
  "Dormitorio":[["Cama 90",90,200],["Cama 135",135,200],["Cama 150",150,200],["Cama 160",160,200],["Mesita noche",40,35],["Cómoda",100,45],["Armario 2 puertas",100,55],["Armario 3 puertas",150,55],["Armario 4 puertas",200,60],["Cuna",70,130]],
  "Estudio":[["Escritorio 140",140,60],["Escritorio en L",150,130,"L"],["Escritorio 120",120,60],["Silla",45,45],["Estantería",80,30],["Librería 2m",200,30],["Mesa de trabajo",160,80]],
  "Salón":[["Sofá 2 plazas",160,90],["Sofá 3 plazas",210,90],["Mueble TV",150,40],["Mesa centro",100,50],["Butaca",80,80],["Mesa comedor",160,90]],
  "Aperturas":[["Puerta 72",72,10,"door"],["Puerta 82",82,10,"door"],["Puerta 92",92,10,"door"],["Ventana 100",100,12,"window"],["Ventana 150",150,12,"window"]],
  "Otros":[["Texto (rótulo)",120,20,"text"],["Radiador",80,10],["Alfombra 160x230",160,230],["Pilar",30,30],["Bloque libre",100,100]]
};
const COLORS = {Dormitorio:"#7aa7e0",Estudio:"#e0b36a",Salón:"#8fc79a",Otros:"#b7a2d6",Aperturas:"#fff"};

let S = {room:{w:400,h:300}, walls:[], items:[]};
let tool="select", snapOn=true, magOn=true, sel=null, hist=[], fut=[], uid=1, drag=null, vb={x:-60,y:-60,w:520,h:420};

/* ---------- estado / historial ---------- */
const snapshot = () => JSON.stringify(S);
function commit(){ hist.push(snapshot()); if(hist.length>200)hist.shift(); fut=[]; persist(); }
function persist(){ try{localStorage.setItem(KEY,snapshot())}catch(e){} }
function restore(j){ S=JSON.parse(j); sel=null; uid=1+Math.max(0,...S.items.map(i=>i.id),...S.walls.map(w=>w.id)); render(); }
function undo(){ if(hist.length>1){ fut.push(hist.pop()); restore(hist[hist.length-1]); persist(); } }
function redo(){ if(fut.length){ const j=fut.pop(); hist.push(j); restore(j); persist(); } }

/* ---------- utilidades ---------- */
const sn = v => snapOn ? Math.round(v/5)*5 : Math.round(v);
const svg = $("#svg");
function pt(e){ const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; const q=p.matrixTransform(svg.getScreenCTM().inverse()); return {x:q.x,y:q.y}; }
const el = (n,a={},p) => { const e=document.createElementNS(NS,n); for(const k in a)e.setAttribute(k,a[k]); if(p)p.appendChild(e); return e; };
const wLen = w => Math.hypot(w.x2-w.x1,w.y2-w.y1);
/* Paredes exteriores: ids -1..-4 (n,s,w,e). Cara interior en x0/y0 y x0+w/y0+h; el grosor crece hacia fuera. */
const OW={"-1":"n","-2":"s","-3":"w","-4":"e"}, OWID={n:-1,s:-2,w:-3,e:-4};
function room(){ const R=S.room; R.x0=R.x0||0; R.y0=R.y0||0; R.t=Object.assign({n:12,s:12,w:12,e:12},R.t); return R; }
function outerObj(id){ const R=room(), ow=OW[id]; return {id,outer:true,ow,t:R.t[ow],pos:ow==="n"?R.y0:ow==="s"?R.y0+R.h:ow==="w"?R.x0:R.x0+R.w}; }
const find = id => id<0 ? outerObj(id) : (S.items.find(i=>i.id===id) || S.walls.find(w=>w.id===id));
/* aperturas que están sobre una pared exterior (para que se muevan con ella) */
function openingsOn(ow){ const o=outerObj(OWID[ow]), h=o.t/2+10, c=o.pos+(ow==="n"||ow==="w"?-o.t/2:o.t/2), horiz=ow==="n"||ow==="s", R=room();
  return S.items.filter(i=>(i.kind==="door"||i.kind==="window")&&(i.rot%180===0)===horiz&&Math.abs((horiz?i.y:i.x)-c)<=h); }
function shiftOpenings(list,horiz,d){ for(const i of list){ if(horiz)i.y+=d; else i.x+=d; } }
function moveOuter(ow,newPos){
  const R=room(), o=outerObj(OWID[ow]), d=newPos-o.pos, horiz=ow==="n"||ow==="s", list=openingsOn(ow);
  if(!d) return;
  if(ow==="n"){ if(R.h-d<100)return; R.y0+=d; R.h-=d; }
  else if(ow==="s"){ if(R.h+d<100)return; R.h+=d; }
  else if(ow==="w"){ if(R.w-d<100)return; R.x0+=d; R.w-=d; }
  else { if(R.w+d<100)return; R.w+=d; }
  shiftOpenings(list,horiz,d);
}
function setOuterT(ow,t){
  const R=room(), old=R.t[ow], horiz=ow==="n"||ow==="s", list=openingsOn(ow); t=Math.max(2,t);
  R.t[ow]=t; shiftOpenings(list,horiz,(t-old)/2*(ow==="n"||ow==="w"?-1:1));
}
const isWall = o => o && "x1" in o;
const isFurn = o => o && !o.outer && !isWall(o);

/* ---------- render ---------- */
function render(){
  if(typeof V3!=="undefined"&&V3.on) V3.dirty=true;
  const R=room(), RW=R.w, RH=R.h, X0=R.x0, Y0=R.y0, T=R.t;
  svg.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  svg.textContent="";
  // rejilla 50 cm
  const g0=el("g",{},svg);
  for(let x=Math.floor(vb.x/50)*50;x<vb.x+vb.w;x+=50) el("line",{x1:x,y1:vb.y,x2:x,y2:vb.y+vb.h,stroke:"currentColor","stroke-opacity":x%100?".05":".12"},g0);
  for(let y=Math.floor(vb.y/50)*50;y<vb.y+vb.h;y+=50) el("line",{x1:vb.x,y1:y,x2:vb.x+vb.w,y2:y,stroke:"currentColor","stroke-opacity":y%100?".05":".12"},g0);
  // habitación: cuatro paredes exteriores independientes + suelo
  el("rect",{x:X0,y:Y0,width:RW,height:RH,fill:"var(--panel)"},svg);
  const OWR={n:[X0-T.w,Y0-T.n,RW+T.w+T.e,T.n],s:[X0-T.w,Y0+RH,RW+T.w+T.e,T.s],w:[X0-T.w,Y0,T.w,RH],e:[X0+RW,Y0,T.e,RH]};
  for(const k in OWR){ const [x,y,w,h]=OWR[k], on=sel===OWID[k];
    el("rect",{x,y,width:w,height:h,fill:"var(--wall)","data-id":OWID[k],stroke:on?"var(--acc)":"none","stroke-width":on?2.5:0,style:"cursor:move"},svg);
    if(on){ const t=el("text",{x:x+w/2,y:y+h/2,"text-anchor":"middle","dominant-baseline":"middle","font-size":11,fill:"#fff","pointer-events":"none"},svg); t.textContent=T[k]+" cm"; } }
  dimLabel(svg,X0,Y0-T.n-6,RW,0,`${RW} cm`);
  dimLabel(svg,X0-T.w-6,Y0,RH,-90,`${RH} cm`);
  // tabiques
  for(const w of S.walls) drawWall(w);
  // mobiliario (aperturas al final para quedar sobre muros)
  [...S.items].sort((a,b)=>(a.kind?1:0)-(b.kind?1:0)).forEach(drawItem);
  if(drag&&drag.ghost){ const w=drag.ghost; drawWall(w,true); }
  props(); hint();
  for(const [id,v] of [["#rw",RW],["#rh",RH]]){ const e=$(id); if(e&&document.activeElement!==e) e.value=v; }
}
function dimLabel(p,x,y,len,rot,text){
  const t=el("text",{x:x+(rot?0:len/2),y:y+(rot?len/2:0),"text-anchor":"middle","font-size":11,fill:"currentColor","fill-opacity":".7",transform:`rotate(${rot} ${x+(rot?0:len/2)} ${y+(rot?len/2:0)})`},p); t.textContent=text;
}
function drawWall(w,ghost){
  const g=el("g",{"data-id":w.id,opacity:ghost?.6:1},svg);
  const a=Math.atan2(w.y2-w.y1,w.x2-w.x1)*180/Math.PI, L=wLen(w);
  const r=el("rect",{x:0,y:-w.t/2,width:L,height:w.t,transform:`translate(${w.x1} ${w.y1}) rotate(${a})`,fill:"#b9a98f",stroke:sel===w.id?"var(--acc)":"#6f6451","stroke-width":sel===w.id?2:1},g);
  // montantes cada 40 cm
  for(let d=0;d<=L;d+=40) el("line",{x1:d,y1:-w.t/2,x2:d,y2:w.t/2,stroke:"#6f6451","stroke-width":.7,transform:`translate(${w.x1} ${w.y1}) rotate(${a})`},g);
  const mx=(w.x1+w.x2)/2,my=(w.y1+w.y2)/2, ang=(a>90||a<-90)?a+180:a;
  const t=el("text",{x:mx,y:my-w.t/2-4,"text-anchor":"middle","font-size":11,fill:"currentColor",transform:`rotate(${ang} ${mx} ${my})`},g);
  t.textContent=Math.round(L)+" cm";
  if(sel===w.id&&!ghost){ for(const [k,x,y] of [[1,w.x1,w.y1],[2,w.x2,w.y2]]) el("circle",{cx:x,cy:y,r:6,fill:"var(--acc)","data-h":k,"data-id":w.id,style:"cursor:move"},svg); }
}
function hostThickness(it){
  if(it.kind!=="door"&&it.kind!=="window") return it.d;
  const horiz=it.rot%180===0, R=room();
  for(const ow of horiz?["n","s"]:["w","e"]){ const o=outerObj(OWID[ow]), c=o.pos+(ow==="n"||ow==="w"?-o.t/2:o.t/2); if(Math.abs((horiz?it.y:it.x)-c)<=o.t/2+10) return o.t; }
  for(const w of S.walls){ if(horiz&&w.y1===w.y2&&Math.abs(it.y-w.y1)<=w.t/2+10) return w.t; if(!horiz&&w.x1===w.x2&&Math.abs(it.x-w.x1)<=w.t/2+10) return w.t; }
  return it.d;
}
function drawItem(it){
  const g=el("g",{"data-id":it.id,transform:`translate(${it.x} ${it.y}) rotate(${it.rot}) scale(${it.fx?-1:1} ${it.fy?-1:1})`,style:"cursor:move"},svg);
  const s=sel===it.id, stroke=s?"var(--acc)":"#00000066";
  if(it.kind==="door"){
    const w=it.w;
    const ht=hostThickness(it); el("rect",{x:-w/2,y:-ht/2-1,width:w,height:ht+2,fill:"var(--panel)"},g);
    el("path",{d:`M ${-w/2} 0 L ${-w/2} ${-w} A ${w} ${w} 0 0 1 ${w/2} 0 Z`,fill:"#2563eb14",stroke:stroke,"stroke-dasharray":"4 3"},g);
    el("line",{x1:-w/2,y1:0,x2:-w/2,y2:-w,stroke:s?"var(--acc)":"#555","stroke-width":3},g);
  } else if(it.kind==="text"){
    el("rect",{x:-it.w/2,y:-it.d/2,width:it.w,height:it.d,fill:"transparent",stroke:s?"var(--acc)":"none","stroke-dasharray":"3 3"},g);
  } else if(it.kind==="window"){
    const wt=hostThickness(it); el("rect",{x:-it.w/2,y:-wt/2,width:it.w,height:wt,fill:"#bfe3f5",stroke:stroke,"stroke-width":s?2:1},g);
    el("line",{x1:-it.w/2,y1:0,x2:it.w/2,y2:0,stroke:"#4a90b8"},g);
  } else if(it.shape==="L"){
    const a=Math.min(it.a,it.d),b=Math.min(it.b,it.w),x0=-it.w/2,y0=-it.d/2;
    el("path",{d:`M ${x0} ${y0} h ${it.w} v ${a} H ${x0+b} V ${-y0} H ${x0} Z`,fill:it.color,"fill-opacity":.75,stroke:stroke,"stroke-width":s?2.5:1,"stroke-linejoin":"round"},g);
  } else {
    el("rect",{x:-it.w/2,y:-it.d/2,width:it.w,height:it.d,fill:it.color,"fill-opacity":.75,stroke:stroke,"stroke-width":s?2.5:1,rx:2},g);
  }
  // etiqueta: sigue el eje largo del mueble y se ajusta de tamaño para caber
  const label=it.kind==="text"?it.name:it.kind?(s?it.name:""):it.shape==="L"?"Escritorio en L":`${it.name} ${it.w}×${it.d}`;
  const vert=it.rot%180===90, along=vert?it.d>=0&&it.w:it.w;
  const t=el("text",{x:0,y:it.kind==="door"?-it.w/2:it.shape==="L"?(-it.d/2+Math.min(it.a,it.d)/2):0,"text-anchor":"middle","dominant-baseline":"middle","pointer-events":"none",fill:"#111"},g);
  t.setAttribute("transform",`scale(${it.fx?-1:1} ${it.fy?-1:1})`+(vert?"":` rotate(${-it.rot})`));
  t.textContent=label;
  let fs=Math.max(5,Math.min(10,(along*1.6)/Math.max(1,label.length)));
  if(it.kind==="text"){ fs=it.d*.6; t.setAttribute("font-weight",600); t.setAttribute("fill","currentColor"); t.setAttribute("fill-opacity",".55"); }
  t.setAttribute("font-size",fs);
}

/* imán: pega los bordes del mueble a caras de paredes/tabiques a <8 cm (solo giros múltiplos de 90°) */
function magnet(o,x,y){
  if(o.rot%90) return [x,y];
  const sw=o.rot%180===0, hx=(sw?o.w:o.d)/2, hy=(sw?o.d:o.w)/2, T=8;
  const R=room(), V=[[R.x0,R.y0,R.y0+R.h],[R.x0+R.w,R.y0,R.y0+R.h]], H=[[R.y0,R.x0,R.x0+R.w],[R.y0+R.h,R.x0,R.x0+R.w]]; // [pos, desde, hasta]
  for(const w of S.walls){ const t=w.t/2;
    if(w.x1===w.x2){ const a=Math.min(w.y1,w.y2),b=Math.max(w.y1,w.y2); V.push([w.x1-t,a,b],[w.x1+t,a,b]); }
    else if(w.y1===w.y2){ const a=Math.min(w.x1,w.x2),b=Math.max(w.x1,w.x2); H.push([w.y1-t,a,b],[w.y1+t,a,b]); } }
  let bx=T,by=T,nx=x,ny=y;
  for(const [f,a,b] of V){ if(y+hy<a-T||y-hy>b+T)continue; for(const c of [f+hx,f-hx]){ const d=Math.abs(x-c); if(d<bx){bx=d;nx=c;} } }
  for(const [f,a,b] of H){ if(x+hx<a-T||x-hx>b+T)continue; for(const c of [f+hy,f-hy]){ const d=Math.abs(y-c); if(d<by){by=d;ny=c;} } }
  return [nx,ny];
}
/* ---------- paneles ---------- */
function buildLib(){
  const L=$("#lib"); L.innerHTML="<h3>Habitación (interior)</h3>";
  const r=document.createElement("div");
  r.innerHTML=`<div class="row"><label>Ancho cm</label><input id="rw" type="number" value="${S.room.w}"></div><div class="row"><label>Fondo cm</label><input id="rh" type="number" value="${S.room.h}"></div>`;
  L.appendChild(r);
  r.querySelectorAll("input").forEach(i=>i.onchange=()=>{ S.room.w=+$("#rw").value||S.room.w; S.room.h=+$("#rh").value||S.room.h; commit(); fit(); });
  for(const [cat,list] of Object.entries(CAT)){
    L.insertAdjacentHTML("beforeend",`<h3>${cat}</h3>`);
    const g=document.createElement("div"); g.className="grid"; L.appendChild(g);
    for(const [name,w,d,kind] of list){
      const b=document.createElement("button"); b.innerHTML=`${name}<small>${w}×${d}</small>`;
      b.onclick=()=>addItem(kind==="L"?{name,w,d,shape:"L",a:60,b:60,color:COLORS[cat],h:75}:{name,w,d,kind,color:COLORS[cat]});
      g.appendChild(b);
    }
  }
}
function addItem(o){
  const it={id:uid++,name:o.name,w:o.w,d:o.d,kind:o.kind||null,shape:o.shape,a:o.a,b:o.b,h:o.h,color:o.color||"#999",x:sn(room().x0+S.room.w/2),y:sn(room().y0+S.room.h/2),rot:0,fx:false,fy:false};
  S.items.push(it); sel=it.id; commit(); render();
}
function props(){
  const P=$("#props"), o=sel&&find(sel);
  if(!o){ P.innerHTML=`<h3>Resumen</h3><p>${S.items.length} elementos · ${S.walls.length} tabiques</p><p style="color:var(--mut)">Selecciona algo o añade mobiliario del catálogo. Con «Dibujar tabique» arrastra sobre el plano para trazar montantes.</p>`; return; }
  if(o.outer){
    const nm={n:"Norte (ventana)",s:"Sur",w:"Oeste",e:"Este"}[o.ow], hz=o.ow==="n"||o.ow==="s";
    P.innerHTML=`<h3>Pared exterior · ${nm}</h3>
    <div class="row"><label>Grosor cm</label><input id="p-t" type="number" value="${o.t}"></div>
    <div class="row"><label>Cara interior ${hz?"Y":"X"}</label><input id="p-pos" type="number" value="${o.pos}"></div>
    <p style="color:var(--mut);font-size:12px">El grosor crece hacia fuera. Mover la pared cambia el tamaño interior de la habitación; las puertas y ventanas de esa pared se mueven con ella. También: arrastrar, flechas (Shift = 10 cm).</p>`;
    $("#p-t").onchange=e=>{ setOuterT(o.ow,+e.target.value||o.t); commit(); render(); };
    $("#p-pos").onchange=e=>{ moveOuter(o.ow,+e.target.value); commit(); render(); };
    return;
  }
  if(isWall(o)){

 75, "y": 335, "rot": 0, "fx": false, "fy": true, "color": "#8fc79a", "h": 75, "z": 0}]};

/* ---------- Vista 3D (three.js, cm → unidades; plano X→x, plano Y→z, altura→y) ---------- */
var V3={on:false,dirty:false,wallH:110,cmp:false,cam:"orbit"};
const DEFH={Cama:50,Mesita:50,Armario:200,Escritorio:75,Mesa:75,Silla:90,Sofá:85,Cómoda:85,Estantería:180,Librería:200,Butaca:85,Mueble:50,TV:70,Radiador:60,Pilar:250,Alfombra:1,Cuna:90,Bloque:100};
const defH = n => { for(const k in DEFH) if(n.startsWith(k)) return DEFH[k]; return 50; };
function box3(w,h,d,color,x,y,z,opts={}){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.85,metalness:0,...opts}));
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; return m;
}
function buildScene(items){
  const sc=new THREE.Scene(), R=room(), W=R.w, H=R.h, X0=R.x0, Y0=R.y0, T=R.t, WH=V3.wallH;
  sc.background=new THREE.Color(getComputedStyle(document.body).getPropertyValue("--bg").trim()||"#f4f5f7");
  sc.add(new THREE.HemisphereLight(0xffffff,0x8a8a8a,.75));
  const sun=new THREE.DirectionalLight(0xffffff,.65); sun.position.set(X0+W*.2,700,Y0+H*1.4); sun.target.position.set(X0+W/2,0,Y0+H/2);
  sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); const c=sun.shadow.camera; c.left=-500;c.right=500;c.top=500;c.bottom=-500;c.near=100;c.far=1800; sc.add(sun,sun.target);
  const floor=box3(W,2,H,0xc8b394,X0+W/2,-1,Y0+H/2); floor.castShadow=false; sc.add(floor);
  // paredes: exteriores (12 cm, hacia fuera) + tabiques
  const segs=[
    {ax:"x",fix:Y0-T.n/2,t:T.n,a:X0-T.w,b:X0+W+T.e,c:0xdedad2},{ax:"x",fix:Y0+H+T.s/2,t:T.s,a:X0-T.w,b:X0+W+T.e,c:0xdedad2},
    {ax:"z",fix:X0-T.w/2,t:T.w,a:Y0,b:Y0+H,c:0xdedad2},{ax:"z",fix:X0+W+T.e/2,t:T.e,a:Y0,b:Y0+H,c:0xdedad2}];
  for(const w of S.walls){ if(w.x1===w.x2) segs.push({ax:"z",fix:w.x1,t:w.t,a:Math.min(w.y1,w.y2),b:Math.max(w.y1,w.y2),c:0xf1eee7});
    else if(w.y1===w.y2) segs.push({ax:"x",fix:w.y1,t:w.t,a:Math.min(w.x1,w.x2),b:Math.max(w.x1,w.x2),c:0xf1eee7}); }
  const ops=segs.map(()=>[]);
  for(const it of S.items){ if(it.kind!=="door"&&it.kind!=="window") continue;
    const ax=it.rot%180===0?"x":"z", al=ax==="x"?it.x:it.y, pe=ax==="x"?it.y:it.x;
    segs.forEach((g,i)=>{ if(g.ax===ax&&Math.abs(pe-g.fix)<=g.t/2+10&&al>=g.a-1&&al<=g.b+1) ops[i].push({c:al,w:it.w,y0:it.kind==="door"?0:130,y1:it.kind==="door"?205:175}); }); }
  segs.forEach((g,i)=>{ if(WH<=0) return;
    const put=(u0,u1,y0,y1)=>{ y1=Math.min(y1,WH); if(u1-u0<.5||y1-y0<.5) return; const L=u1-u0,hh=y1-y0,m=(u0+u1)/2;
      sc.add(g.ax==="x"?box3(L,hh,g.t,g.c,m,y0+hh/2,g.fix):box3(g.t,hh,L,g.c,g.fix,y0+hh/2,m)); };
    let cur=g.a; for(const o of ops[i].sort((p,q)=>p.c-q.c)){ const f=o.c-o.w/2,t=o.c+o.w/2; put(cur,f,0,WH); put(f,t,0,o.y0); put(f,t,o.y1,WH); cur=t; } put(cur,g.b,0,WH); });
  // elementos
  for(const it of items){ const g=new THREE.Group(); g.position.set(it.x,0,it.y); g.rotation.y=-it.rot*Math.PI/180; g.scale.set(it.fx?-1:1,1,it.fy?-1:1);
    const w=it.w,d=it.d;
    if(it.kind==="door"){ const lh=WH>0?Math.min(203,WH):203; g.add(box3(4,lh,w,0xb98b5e,-w/2,lh/2,-w/2)); }
    else if(it.kind==="window"){ g.add(box3(w,45,2,0x9fd3ee,0,152,0,{transparent:true,opacity:.35,roughness:.1})); }
    else if(it.kind==="text"){ continue; }
    else furniture(g,it);
    sc.add(g); }
  return sc;
}
function furniture(g,it){
  const w=it.w,d=it.d,h=it.h||defH(it.name),z0=it.z||0,col=new THREE.Color(it.color), n=it.name;
  if(/^Cama|^Cuna/.test(n)){
    g.add(box3(w,25,d,0x8b6b4a,0,12.5,0)); g.add(box3(w-4,h-25,d-4,0xf3f1ec,0,25+(h-25)/2,0));
    g.add(box3(w-2,h-21,d-60,col,0,h+1.5,30));                       // nórdico
    for(const sx of [-1,1]) g.add(box3(w/2-8,10,38,0xffffff,sx*(w/4),h+5,-d/2+28));
    g.add(box3(w+6,h+55,6,0x8b6b4a,0,(h+55)/2,-d/2-1));              // cabecero (lado -z)
  } else if(/^Armario|^Estantería|^Librería|^Cómoda/.test(n)){
    g.add(box3(w,h,d,col,0,h/2,0)); const k=Math.max(2,Math.round(w/50));
    for(let i=1;i<k;i++){ const x=-w/2+i*w/k; g.add(box3(.8,h-6,1,0x6b5a40,x,h/2,d/2+.3)); g.add(box3(1.5,22,1.5,0x333333,x-4,h*.5,d/2+1)); g.add(box3(1.5,22,1.5,0x333333,x+4,h*.5,d/2+1)); }
  } else if(it.shape==="L"){
    const a=Math.min(it.a,d),b=Math.min(it.b,w), x0=-w/2, zt=-d/2;
    g.add(box3(w,3,a,col,0,h-1.5,zt+a/2)); g.add(box3(b,3,d-a,col,x0+b/2,h-1.5,zt+a+(d-a)/2));
    for(const [lx,lz] of [[w/2-4,zt+4],[x0+4,zt+4],[w/2-4,zt+a-4],[x0+b-4,zt+a-4],[x0+4,d/2-4],[x0+b-4,d/2-4]]) g.add(box3(4,h-3,4,0x555555,lx,(h-3)/2,lz));
  } else if(/^Escritorio|^Mesa/.test(n)&&!/noche/.test(n)){
    g.add(box3(w,3,d,col,0,h-1.5,0)); for(const sx of[-1,1])for(const sz of[-1,1]) g.add(box3(4,h-3,4,0x555555,sx*(w/2-4),(h-3)/2,sz*(d/2-4)));
  } else if(/^TV/.test(n)){
    g.add(box3(w,h,d,0x111111,0,z0+h/2,0)); g.add(box3(w-4,h-4,1,0x22313f,0,z0+h/2,d/2+.1,{emissive:0x0a1520}));
    return;
  } else if(/Mesita/.test(n)){
    g.add(box3(w,h,d,col,0,h/2,0)); g.add(box3(w-6,2,1,0x333333,0,h-12,d/2+.2)); g.add(box3(w-6,2,1,0x333333,0,h-30,d/2+.2));
  } else g.add(box3(w,h,d,col,0,z0+h/2,0));
}
let R3=null,CT=null,CAM3=null,SC3=[],RO=null;
function init3D(){
  const host=$("#v3c"); R3=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); R3.setPixelRatio(Math.min(2,devicePixelRatio||1));
  R3.shadowMap.enabled=true; R3.shadowMap.type=THREE.PCFSoftShadowMap; R3.setScissorTest(true); host.appendChild(R3.domElement);
  CAM3=new THREE.PerspectiveCamera(45,1,5,4000); CT=new THREE.OrbitControls(CAM3,R3.domElement); CT.maxPolarAngle=Math.PI*.499;
  RO=new ResizeObserver(()=>{ R3.setSize(host.clientWidth,host.clientHeight,false); R3.domElement.style.width="100%"; R3.domElement.style.height="100%"; }); RO.observe(host);
  setCam(V3.cam);
}
function setCam(k){
  V3.cam=k; const R0=room(), W=R0.w,H=R0.h, bed=S.items.find(i=>/^Cama/.test(i.name)), tv=S.items.find(i=>/^TV/.test(i.name));
  const X0=R0.x0,Y0=R0.y0; let p=[X0+W/2+100,600,Y0+H+470], t=[X0+W/2,0,Y0+H/2];
  if(k==="top"){ p=[X0+W/2,Math.max(W,H)*1.25,Y0+H/2+1]; }
  if(k==="door"){ p=[X0+18,165,Y0+H*.55]; t=[X0+W*.6,90,Y0+H*.45]; }
  if(k==="bed"){ if(bed){ p=[bed.x,95,bed.y]; } t=tv?[tv.x,(tv.z||75)+(tv.h||71)/2,tv.y]:[X0+W/2,90,Y0+H/2]; }
  CAM3.position.set(...p); CT.target.set(...t); CT.update();
}
function loop3D(tok){
  if(!V3.on||tok!==V3.tok) return; requestAnimationFrame(()=>loop3D(tok));
  if(V3.dirty){ V3.dirty=false; SC3.forEach(s=>s.traverse(o=>{ if(o.geometry)o.geometry.dispose(); if(o.material)o.material.dispose(); }));
    SC3=[buildScene(S.items)]; }
  CT.update(); const w=R3.domElement.clientWidth,h=R3.domElement.clientHeight, n=SC3.length;
  for(let i=0;i<n;i++){ const vw=Math.floor(w/n); R3.setViewport(i*vw,0,vw,h); R3.setScissor(i*vw,0,vw,h); CAM3.aspect=vw/h; CAM3.updateProjectionMatrix(); R3.render(SC3[i],CAM3); }
}
function toggle3D(){
  if(typeof THREE==="undefined"){ alert("No se pudo cargar vendor/three.min.js"); return; }
  V3.on=!V3.on; $("#v3").hidden=!V3.on; $("#b3d").classList.toggle("on",V3.on);
  if(V3.on){ if(!R3) init3D(); V3.dirty=true; setCam(V3.cam); const tok=V3.tok=(V3.tok||0)+1; requestAnimationFrame(()=>loop3D(tok)); }
}
$("#b3d").onclick=toggle3D;
$("#v3cam").onchange=e=>setCam(e.target.value);
$("#v3wall").onchange=e=>{ V3.wallH=+e.target.value; V3.dirty=true; };
$("#v3png").onclick=()=>{ V3.dirty=true; requestAnimationFrame(()=>R3.domElement.toBlob(b=>download(b,"habitacion-3d.png"))); };

  let j=null; try{ j=localStorage.getItem(KEY); }catch{}
  if(j){ try{ S=JSON.parse(j); }catch{} }
  else { S=planoInicial(); }
  uid=1+Math.max(0,...S.items.map(i=>i.id),...S.walls.map(w=>w.id));
